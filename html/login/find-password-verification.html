<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>슈마커</title>

  <link rel="stylesheet" href="../../assets/css/style.min.css">
  <!-- Style Add -->
  <link rel="stylesheet" href="../../assets/css/style-add.css">
  <!-- Library -->
  <link rel="stylesheet" href="../../assets/css/swiper-bundle.min.css">
</head>
<body>
  <div id="wrap">

    <!-- Header -->
    <header id="header" class="header"></header>

    <!-- Content -->
    <main class="container page-login">
      <!-- 하단 고정 버튼이 있을 경우 section--fixed 추가 -->
      <section class="section section--fixed">
        <div class="section__inner">
          <!-- 타이틀 -->
          <div class="section__header">
            <button type="button" class="btn-icon btn-icon--back" aria-label="뒤로가기">
              <span class="btn-icon__icon"></span>
            </button>
            <h2 class="section__title">비밀번호 찾기</h2>
          </div>
          <div class="login-find">
            <div class="login-find__inner">
              <div class="login-find__intro">
                <p class="login-find__desc">
                  휴대폰 본인 인증을 통하여 <br />
                  회원님의 소중한 비밀번호를 찾을 수 있어요!
                </p>
              </div>
              <div class="login-find__form">
                <!-- 아이디 -->
                <div class="form__field is-required">
                  <label for="input1" class="form__label">아이디 입력</label>
                  <input type="password" id="input1" class="form__input"/>
                </div>
              </div>
              <!-- 버튼 -->
              <div class="cta cta--fixed">
                <button type="button" class="btn btn--primary btn--cut-conners">휴대폰 본인 인증 하기</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer id="footer" class="footer"></footer>
  </div>

  <!-- Script for loading header and footer (퍼블용) -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        await Promise.all(
          ["header", "footer"].map(async id => {
            const el = document.getElementById(id);
            if (!el) return;
            const file = el.dataset.file || `${id}.html`;
            const res = await fetch(`../include/${file}`);
            if (!res.ok) {
              throw new Error(`${file} 로드 실패`);
            }
            el.innerHTML = await res.text();
          })
        );
      } catch (error) {
        console.error(error);
      }
    });
  </script>
  <!-- Scripts  -->
  <script src="../../assets/js/jquery-3.7.1.min.js"></script>
  <script src="../../assets/js/swiper-bundle.min.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <!-- Script for loading header and footer (퍼블용) -->
  <script>
    window.addEventListener('load', function () {
      
    });
  </script>
</body>
</html>
